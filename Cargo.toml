# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "projectmanagement-plugin"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Project management for sicompass: a kanban board in a list and on a grid, with optional cloud sync, as a plugin"
repository = "https://github.com/friendlyflow/projectmanagement-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The board and the sync logic
# are the library, which the unit tests use.
[[bin]]
name = "projectmanagement-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model, from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
# Cloud sync: the store's Merkle tree, the three-way merge, the sync protocol,
# debouncing and the row. In the SDK repo, at an SDK release tag.
sicompass-sync = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", tag = "v0.9.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sync's HTTP, to the sync server. rustls with bundled roots, so the
# static musl build needs no system TLS library.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# [patch.crates-io]
# sicompass-sdk = { path = "../sicompass-plugin-sdk" }
# [patch."https://github.com/friendlyflow/sicompass-plugin-sdk"]
# sicompass-sync = { path = "../sicompass-plugin-sdk/sicompass-sync" }
