# Its own workspace root: a plugin, only ever built for wasm32-wasip2 (and
# natively for its unit tests).
[workspace]

[package]
name = "projectmanagement-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Project management for sicompass: a kanban board in a list and on a grid, with optional cloud backup, as a WASM plugin"
repository = "https://github.com/friendlyflow/projectmanagement_plugin_sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest kit and the FFON model, from crates.io.
sicompass-pdk = "0.6.0"
sicompass-sdk = { version = "0.9.0", default-features = false }
# Cloud backup: store snapshots, the backup protocol, debouncing and the row.
# In the SDK repo, at the release the SDK above came from.
sicompass-payments = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", tag = "v0.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
# Guests ship as bytecode, and App Store builds interpret rather than JIT them, so
# a small module matters more than aggressive inlining.
opt-level = "s"
lto = true
strip = true

# Working on the SDK and this plugin together: uncomment, and comment it out
