# Its own workspace root: a plugin, a program of its own that sicompass starts.
[workspace]

[package]
name = "projectmanagement-plugin"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Project management for sicompass: a kanban board in a list and on a grid, with optional cloud backup, as a plugin"
repository = "https://github.com/friendlyflow/projectmanagement-plugin-sicompass"
# A plugin ships as a signed release the sicompass Store installs, never on crates.io.
publish = false

# The program sicompass starts (src/main.rs). The board and the backup logic
# are the library, which the unit tests use.
[[bin]]
name = "projectmanagement-plugin"
path = "src/main.rs"

[dependencies]
# The plugin kit (`plugin`) and the FFON model, from crates.io.
sicompass-sdk = { version = "0.9.1", default-features = false, features = ["plugin"] }
# Cloud backup: store snapshots, the backup protocol, debouncing and the row.
# In the SDK repo, at the release the SDK above came from.
sicompass-payments = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", tag = "v0.9.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The backup's HTTP, to the backup server. rustls with bundled roots, so the
# static musl build needs no system TLS library.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# One small executable per platform, downloaded by the Store.
opt-level = "s"
lto = true
strip = true
codegen-units = 1

# Working on the SDK and this plugin together: uncomment, and comment it out
# again before committing. With it live, a green build proves nothing about what
# the published crates resolve to.
#
# TEMPORARY, until sicompass-sdk 0.9.1 is on crates.io: the SDK commit with the
# plugin kit (`plugin` feature), by git rev. Remove this section at the release.
[patch.crates-io]
sicompass-sdk = { git = "https://github.com/friendlyflow/sicompass-plugin-sdk", rev = "06a9037b5a1194be87af786bdfde928be173473e" }
